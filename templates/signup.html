<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Signup</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins', sans-serif;
        }

        body{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(135deg,#4facfe,#00f2fe);
        }

        .signup-container{
            width:400px;
            background:#fff;
            padding:40px;
            border-radius:20px;
            box-shadow:0 10px 30px rgba(0,0,0,0.2);
            animation:fadeIn 0.6s ease;
        }

        @keyframes fadeIn{
            from{
                opacity:0;
                transform:translateY(20px);
            }
            to{
                opacity:1;
                transform:translateY(0);
            }
        }

        .signup-container h2{
            text-align:center;
            margin-bottom:30px;
            color:#333;
            font-size:28px;
        }

        .input-group{
            position:relative;
            margin-bottom:25px;
        }

        .input-group input{
            width:100%;
            padding:14px 45px;
            border:1px solid #ccc;
            border-radius:12px;
            outline:none;
            font-size:15px;
            transition:0.3s;
        }

        .input-group input:focus{
            border-color:#4facfe;
            box-shadow:0 0 8px rgba(79,172,254,0.4);
        }

        .input-group i{
            position:absolute;
            left:15px;
            top:50%;
            transform:translateY(-50%);
            color:#777;
        }

        .signup-btn{
            width:100%;
            padding:14px;
            border:none;
            border-radius:12px;
            background:#4facfe;
            color:white;
            font-size:16px;
            font-weight:600;
            cursor:pointer;
            transition:0.3s;
        }

        .signup-btn:hover{
            background:#00c6fb;
        }

        .login-link{
            text-align:center;
            margin-top:20px;
            font-size:14px;
        }

        .login-link a{
            text-decoration:none;
            color:#4facfe;
            font-weight:600;
        }

        .login-link a:hover{
            text-decoration:underline;
        }

        .logo{
            text-align:center;
            margin-bottom:20px;
        }

        .logo i{
            font-size:55px;
            color:#4facfe;
        }

    </style>
</head>
<body>

    <div class="signup-container">

        <div class="logo">
            <i class="fa-solid fa-user-plus"></i>
        </div>

        <h2>Create Account</h2>

        <form method="POST">

            <div class="input-group">
                <i class="fa-solid fa-user"></i>
                <input
                    type="text"
                    name="username"
                    placeholder="Enter Username"
                    required
                >
            </div>

            <div class="input-group">
                <i class="fa-solid fa-lock"></i>
                <input
                    type="password"
                    name="password"
                    placeholder="Enter Password"
                    required
                >
            </div>

            <button type="submit" class="signup-btn">
                Sign Up
            </button>

        </form>

        <div class="login-link">
            Already have an account?
            <a href="/login">Login</a>
        </div>

    </div>

</body>
</html>
