<!DOCTYPE html>
<html>
<head>
    <title>Quiz Result</title>

    <style>

        body {
            background: #1e1e2f;
            color: white;
            font-family: Arial;
            text-align: center;
            padding-top: 100px;
        }

        .score-box {
            background: #2b2b40;
            width: 400px;
            margin: auto;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
        }

        h1 {
            margin-bottom: 10px;
        }

        .score {
            font-size: 45px;
            color: #4CAF50;
        }

        .message {
            font-size: 20px;
            margin: 20px 0;
        }

        a {
            color: white;
            text-decoration: none;
            background: #4CAF50;
            padding: 12px 20px;
            border-radius: 8px;
            display: inline-block;
            margin-top: 15px;
        }

        a:hover {
            background: #45a049;
        }

    </style>
</head>

<body>

<div class="score-box">

    <h1>🎉 Quiz Completed</h1>

    <h2>Your Score</h2>

    <div class="score">
        {{ score }}/{{ total }}
    </div>

    <div class="message">

        {% if score >= total * 0.7 %}
            Excellent Performance 🚀
        {% elif score >= total * 0.4 %}
            Good Job 👍
        {% else %}
            Keep Practicing 📚
        {% endif %}

    </div>

    <a href="/quiz">Play Again</a>

    <br><br>

    <a href="/logout">Logout</a>

</div>

</body>
</html>
